# BookALook — Redis instance 1: CACHE (port 6379)
#
# Future application cache only. Everything here can be lost at any time:
# no persistence, and the least recently used keys are evicted when full.
# Installed to /etc/bookalook-redis/cache/redis.conf by 10-install.sh.
# Works with Redis 7.2+ / 8.x and Valkey 7.2+ / 8.x (same directives).

# --- Network: this machine only -------------------------------------------
bind 127.0.0.1 -::1
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Process -----------------------------------------------------------------
# systemd starts it (Type=notify) and restarts it; no daemonising.
daemonize no
supervised systemd
pidfile /run/bookalook-redis-cache/redis.pid
loglevel notice
logfile /var/log/bookalook-redis/cache.log
databases 16
# Keeps transparent huge pages off for this process, whatever the host says.
disable-thp yes

# --- Access: users live in their own ACL file (hashed passwords only) --------
aclfile /etc/bookalook-redis/cache/users.acl

# --- Memory ----------------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# --- Persistence: none (a cache rebuilds itself from PostgreSQL) -----------
save ""
appendonly no
dir /var/lib/bookalook-redis/cache

# --- Housekeeping ------------------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
