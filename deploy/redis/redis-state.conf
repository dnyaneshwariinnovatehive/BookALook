# BookALook — Redis instance 2: STATE / QUEUE (port 6380)
#
# Future queues, OTP state, rate limits and locks. Nothing may be evicted:
# when full, writes fail loudly instead of silently dropping a job.
# AOF (fsync every second) plus periodic RDB snapshots.
# Installed to /etc/bookalook-redis/state/redis.conf by 10-install.sh.

# --- Network: this machine only -------------------------------------------
bind 127.0.0.1 -::1
port 6380
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Process -----------------------------------------------------------------
daemonize no
supervised systemd
pidfile /run/bookalook-redis-state/redis.pid
loglevel notice
logfile /var/log/bookalook-redis/state.log
databases 16
disable-thp yes

# --- Access ------------------------------------------------------------------
aclfile /etc/bookalook-redis/state/users.acl

# --- Memory: never evict ---------------------------------------------------
maxmemory 256mb
maxmemory-policy noeviction

# --- Persistence -------------------------------------------------------------
dir /var/lib/bookalook-redis/state

# RDB snapshots: after 1 h if 1 change, 5 min if 100, 1 min if 10000.
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF: at most about one second of writes lost on a crash.
appendonly yes
appendfsync everysec
appenddirname "appendonly"
appendfilename "appendonly.aof"
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
no-appendfsync-on-rewrite no

# --- Housekeeping ------------------------------------------------------------
lazyfree-lazy-expire yes
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
